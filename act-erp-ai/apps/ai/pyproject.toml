[project]
name = "act-ai"
version = "0.1.0"
description = "ACT ERP-AI service: agent runtime + ingestion worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "sse-starlette>=2.1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "litellm>=1.50",          # LLM + embeddings gateway -> Bedrock
    "boto3>=1.34",            # S3, SQS (Bedrock goes through litellm)
    "asyncpg>=0.29",          # Postgres (raw SQL against Prisma-owned schema)
    "pgvector>=0.3",          # asyncpg vector codec
    "pandas>=2.2",            # CSV/XLSX ingestion
    "openpyxl>=3.1",          # XLSX
    "pyyaml>=6.0",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["act_ai"]
