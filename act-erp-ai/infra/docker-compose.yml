# Local dev topology — mirrors production (Postgres+pgvector, S3, SQS) so
# "works locally" means "works on Fargate". No Redis, no Lambda.
name: act-erp-ai

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: act
      POSTGRES_PASSWORD: act
      POSTGRES_DB: act
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U act"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: s3,sqs
      DEBUG: "0"
    ports:
      - "4566:4566"
    volumes:
      - ./localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh

  ai-agent:
    build:
      context: ../apps/ai
      dockerfile: ../../infra/Dockerfile.ai
    command: ["uvicorn", "act_ai.main:app", "--host", "0.0.0.0", "--port", "8001"]
    env_file: ../apps/ai/.env
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  ai-worker:
    build:
      context: ../apps/ai
      dockerfile: ../../infra/Dockerfile.ai
    command: ["python", "-m", "act_ai.worker"]
    env_file: ../apps/ai/.env
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_started

  web:
    build:
      context: ../apps/web
      dockerfile: ../../infra/Dockerfile.web
    env_file: ../apps/web/.env.local
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      ai-agent:
        condition: service_started

volumes:
  pgdata:
